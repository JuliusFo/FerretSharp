# Keeps the actions pinned to commits current: release, pages and the coverage job that pushes (review 3.40.0 A35, 3.44.0 A28). NuGet and the
# libraries in wwwroot/lib are updated by hand in a package of their own (WP-36).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
