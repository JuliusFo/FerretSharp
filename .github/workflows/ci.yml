# Build and tests on every push to main and every pull request.
# Linux: Core and UI must build without Windows APIs (CLAUDE.md, section 4); unit tests and the integration tests,
# which start Oracle Free in Docker (Testcontainers) and run the model host against the sample project (net8.0).
# The Linux tests measure code coverage (settings: tests/coverage.config): summary on the run page, HTML report as
# artifact, and on main the badge in the README (coverage.json on the branch "badges", shown by shields.io).
# Windows: the whole solution including the WPF host; unit tests only (the runner's Docker runs Windows containers).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same pull request (or of main) cancels the older one. Pull requests are keyed by their number, not
# by github.ref: a pull_request run that GitHub starts only after the merge no longer has the refs/pull/N/merge ref and
# landed in the group of main – it cancelled main's run of the merge commit (2026-11-10, after WP-82).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Core, UI and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERAGE_ARGS: >-
        --coverage --coverage-output-format cobertura
        --coverage-settings ${{ github.workspace }}/tests/coverage.config
        --results-directory ${{ github.workspace }}/coverage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # Runtime for the model host, which runs in the sample project's .NET 8, and for the app the trace tests attach to (WP-33).
          dotnet-version: 8.0.x

      - name: Build Core, UI and AppTrace
        run: |
          dotnet build src/FerretSharp.Core -warnaserror
          dotnet build src/FerretSharp.UI -warnaserror
          dotnet build src/FerretSharp.AppTrace -warnaserror

      - name: Unit tests
        run: |
          dotnet test tests/FerretSharp.Core.Tests $COVERAGE_ARGS --coverage-output core.cobertura.xml
          dotnet test tests/FerretSharp.UI.Tests $COVERAGE_ARGS --coverage-output ui.cobertura.xml

      - name: Integration tests (Oracle in Docker)
        run: dotnet test tests/FerretSharp.Integration.Tests $COVERAGE_ARGS --coverage-output integration.cobertura.xml

      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:'coverage/*.cobertura.xml' -targetdir:coverage/report \
            -reporttypes:'Html;JsonSummary;MarkdownSummaryGithub' -title:FerretSharp
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          # Endpoint badge for shields.io (https://shields.io/badges/endpoint-badge).
          jq '.summary.linecoverage' coverage/report/Summary.json | awk '{
            color = $1 >= 90 ? "brightgreen" : $1 >= 75 ? "green" : $1 >= 60 ? "yellowgreen" : $1 >= 40 ? "yellow" : "red"
            printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%d%%\",\"color\":\"%s\"}\n", $1, color
          }' > coverage/report/coverage.json
          cat coverage/report/coverage.json

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 14

  # Every committed text file must equal its normalized form. A .cs file (attribute "text") committed with CRLF in some
  # lines is modified right after checkout and broke the badge job's branch switch (2026-11-12). The check is stricter
  # than that: it also names files under text=auto. Its own job, so a hit does not skip build and tests. git status
  # misses such a file while the index stat data is fresh; renormalize compares the content.
  line-endings:
    name: Line endings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Normalized form
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Files differ from their normalized form (CRLF in the repository). Fix with: git add --renormalize <file>"
            git -c core.quotePath=false diff --cached --stat=200
            exit 1
          fi

  coverage-badge:
    name: Coverage badge
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Pinned to commits like release and pages (review 3.44.0, A28): this job may push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage

      # The branch "badges" holds only coverage.json; it is created on the first run. --discard-changes: the badge must
      # not fail on a dirty checkout of main (the job line-endings reports that).
      - name: Publish coverage.json
        run: |
          if git fetch --depth=1 origin badges; then
            git switch --discard-changes --force-create badges FETCH_HEAD
          else
            git switch --discard-changes --orphan badges
          fi
          cp "$RUNNER_TEMP/coverage/coverage.json" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Coverage $(jq -r .message coverage.json) for ${GITHUB_SHA::7}"
          git push origin badges

  windows:
    name: Solution (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -warnaserror

      - name: Unit tests
        run: |
          dotnet test tests/FerretSharp.Core.Tests --no-build
          dotnet test tests/FerretSharp.UI.Tests --no-build
