# Publishes a GitHub release when a version tag (v1.2.3) is pushed: self-contained win-x64 build, packed with Velopack
# (WP-32, ADR 0024) into Setup.exe, a portable zip and the update packages the app looks for, plus the plain zip (folder
# deployment, the files at the zip's root) for one more release. Release notes from the tag's section in CHANGELOG.md.
# For a tag that already exists: run it by hand (Actions → Release → Run workflow) with the tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v3.5.0
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ inputs.tag || github.ref_name }}
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check the version
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Not a version tag: $env:TAG" }
          $version = $Matches[1]
          $declared = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($declared -ne $version) { throw "Tag $env:TAG does not match <Version>$declared</Version> in Directory.Build.props." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Unit tests
        run: dotnet test tests/FerretSharp.Core.Tests

      - name: Publish
        run: dotnet publish src/FerretSharp.App -c Release -r win-x64 --self-contained -o "publish/FerretSharp-$env:VERSION-win-x64"

      - name: Zip
        run: Compress-Archive -Path "publish/FerretSharp-$env:VERSION-win-x64/*" -DestinationPath "FerretSharp-$env:VERSION-win-x64.zip"

      - name: Release notes from CHANGELOG.md
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $heading = $lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]" | Select-Object -First 1
          if (-not $heading) { throw "CHANGELOG.md has no section [$env:VERSION]." }
          $section = @()
          foreach ($line in $lines[$heading.LineNumber..($lines.Count - 1)]) {
            if ($line -match '^## \[') { break }
            $section += $line
          }
          $changes = ($section -join "`n").Trim()
          # What the app shows in its update dialog (packed into the release by vpk).
          Set-Content changes.md $changes -Encoding utf8
          $notes = $changes + "`n`n---`n**Download** (Windows 10/11, x64; the WebView2 runtime is part of Windows):`n" +
            "- ``FerretSharp-win-Setup.exe`` – installs FerretSharp for your user (no admin rights); the app reports new versions and updates itself on a click. The installer is not signed: Windows SmartScreen warns once (More info › Run anyway).`n" +
            "- ``FerretSharp-win-Portable.zip`` – the same without installing; unzip anywhere and start ``FerretSharp.exe``, it updates itself too.`n" +
            "- ``FerretSharp-$env:VERSION-win-x64.zip`` – the plain folder as before, without updates; it goes away with the next releases.`n" +
            "`nConnections, workspaces and settings stay in ``%APPDATA%\FerretSharp`` whichever you choose."
          Set-Content notes.md $notes -Encoding utf8

      - name: Restore tools
        run: dotnet tool restore

      # The last Velopack release, so vpk can make a delta package from it. None before 3.29.0: then only full packages.
      - name: Previous release for delta packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "No previous Velopack release found – this release has full packages only."
            $global:LASTEXITCODE = 0
          }

      # The .pdb files stay in the package as in the zip (stack traces in the log with line numbers): '^$' never matches,
      # it replaces vpk's default exclude of *.pdb.
      - name: Pack with Velopack
        run: >
          dotnet vpk pack --packId FerretSharp --packVersion $env:VERSION --packTitle FerretSharp
          --packDir "publish/FerretSharp-$env:VERSION-win-x64" --mainExe FerretSharp.exe
          --icon src/FerretSharp.App/Assets/ferretsharp.ico --releaseNotes changes.md
          --exclude '^$' --outputDir releases

      # vpk creates the release as a draft with its assets (Setup.exe, portable zip, packages, releases.win.json); then the
      # notes, the plain zip, and publish.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases --tag $env:TAG --releaseName "FerretSharp $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed." }
          gh release upload $env:TAG "FerretSharp-$env:VERSION-win-x64.zip"
          gh release edit $env:TAG --title "FerretSharp $env:VERSION" --notes-file notes.md --draft=false
