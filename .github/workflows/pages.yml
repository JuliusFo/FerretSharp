# The redirect page for links (ADR 0026, addendum): publishes the folder pages/ to GitHub Pages, nothing else.
# https://juliusfo.github.io/FerretSharp/open/#v=1&… turns into ferretsharp://open?v=1&… in the browser; chats and
# tickets (Teams, Azure DevOps) only make https addresses clickable. Pages must be set to "GitHub Actions" in the
# repository settings once.
name: Pages

on:
  push:
    branches: [main]
    paths: [pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Redirect page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to commits (review 3.40.0, A35): the page reads the values of every link clicked (ADR 0026); Dependabot
      # keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
